<div class="chat-modal-view">
    <div class="summary-section">
        <div class="summary-kicker">AI CALL SUMMARY</div>
        <strong>📌 สรุปใจความสำคัญ</strong>
        <div id="modal_summary_text">AI กำลังสรุปข้อมูล...</div>
    </div>
    <div id="modal_chat_flow" class="chat-flow"></div>
</div>

<script>
function updateModalContent(data) {
    const summaryDiv = document.getElementById("modal_summary_text");
    summaryDiv.innerText = data.summary || "ไม่มีบทสรุป";
    const chatFlow = document.getElementById("modal_chat_flow");
    chatFlow.innerHTML = "";
    const convo = data.conversation || data.segments || [];
    if (convo.length === 0) {
        chatFlow.innerHTML = "<p class='empty-chat'>ไม่พบข้อมูลบทสนทนา</p>";
        return;
    }
    convo.forEach(msg => {
        const isAgent = ["พนักงาน", "Agent", "พนักงานบริการ"].includes(msg.speaker);
        let sentimentHtml = "";
        if (msg.sentiment === 'positive') sentimentHtml = "😊 พอใจ";
        else if (msg.sentiment === 'negative') sentimentHtml = "🚩 หงุดหงิด";
        else if (msg.sentiment) sentimentHtml = "😐 ปกติ";
        const safeSpeaker = msg.speaker || 'Unknown';
        const safeText = msg.text || '';
        const wrap = document.createElement('div');
        wrap.className = 'message-group ' + (isAgent ? 'is-agent' : 'is-customer');
        const speaker = document.createElement('span');
        speaker.className = 'speaker-label'; speaker.textContent = safeSpeaker;
        const bubble = document.createElement('div');
        bubble.className = 'bubble'; bubble.textContent = safeText;
        const meta = document.createElement('div');
        meta.className = 'meta'; meta.textContent = sentimentHtml ? 'อารมณ์: ' + sentimentHtml : '';
        wrap.appendChild(speaker);wrap.appendChild(bubble);wrap.appendChild(meta);chatFlow.appendChild(wrap);
    });
}
</script>

<style>
.chat-modal-view{font-family:'Inter','DM Sans',system-ui,sans-serif;color:#edf3ff;padding:6px;}
.summary-section{background:linear-gradient(135deg,rgba(117,170,255,.12),rgba(140,124,255,.08));padding:18px;border:1px solid rgba(154,179,220,.18);margin-bottom:22px;border-radius:18px;box-shadow:0 14px 30px rgba(0,0,0,.16);}
.summary-kicker{font-size:10px;letter-spacing:.16em;color:#75aaff;font-weight:800;margin-bottom:8px;}
.summary-section strong{font-size:16px;color:#edf3ff;}
#modal_summary_text{margin-top:10px;font-size:14px;line-height:1.75;color:#a1b5d7;}
.chat-flow{display:flex;flex-direction:column;gap:16px;}
.message-group{display:flex;flex-direction:column}.message-group.is-agent{align-items:flex-start}.message-group.is-customer{align-items:flex-end}
.speaker-label{font-size:11px;color:#6f86ab;margin-bottom:5px;padding:0 6px;font-weight:700;}
.bubble{padding:12px 16px;max-width:86%;font-size:14px;line-height:1.6;border-radius:18px;box-shadow:0 10px 24px rgba(0,0,0,.12);}
.is-agent .bubble{background:linear-gradient(135deg,rgba(117,170,255,.25),rgba(140,124,255,.20));color:#edf3ff;border:1px solid rgba(117,170,255,.18);border-top-left-radius:5px;}
.is-customer .bubble{background:rgba(255,255,255,.05);color:#edf3ff;border:1px solid rgba(154,179,220,.16);border-top-right-radius:5px;}
.meta{font-size:10px;color:#6f86ab;margin-top:5px;padding:0 5px;font-style:italic;}.empty-chat{text-align:center;color:#6f86ab;padding:30px 0;}
.modal-content::-webkit-scrollbar{width:7px}.modal-content::-webkit-scrollbar-track{background:transparent}.modal-content::-webkit-scrollbar-thumb{background:rgba(117,170,255,.24);border-radius:999px}.modal-content::-webkit-scrollbar-thumb:hover{background:rgba(117,170,255,.42)}
</style>

<style id="readable-type">
.summary-kicker, .speaker-label, .meta { font-size: 13px !important; }
#modal_summary_text, .bubble { font-size: 16px !important; }
</style>
